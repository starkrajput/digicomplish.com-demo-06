
  <!-- Shared closing call to action: tools/partials/cta.html. Edit here, then run tools/build_services.py -->
  <section class="dcs-cta" id="talk" aria-labelledby="dcs-cta-h">
    <div class="digi-wrap dcs-cta-grid">
      <div class="dcs-cta-copy">
        <h2 id="dcs-cta-h">{{HEADING}}</h2>
        <p>{{LINE}}</p>
      </div>
      <div class="dcs-cta-form">
        <form class="dcs-form" novalidate data-endpoint="{{ENDPOINT}}" aria-describedby="dcs-form-consent">
          <input type="hidden" name="request" value="expert">
          <div class="dcs-hp" aria-hidden="true"><label for="dcs-website">Leave this field empty</label><input type="text" id="dcs-website" name="website" tabindex="-1" autocomplete="off"></div>
          <div class="dcs-fields">
            <div class="dcs-field"><label for="dcs-name">Name</label><input type="text" id="dcs-name" name="name" autocomplete="name" required aria-describedby="dcs-name-err"><p class="dcs-err" id="dcs-name-err" hidden></p></div>
            <div class="dcs-field"><label for="dcs-email">Work email</label><input type="email" id="dcs-email" name="email" autocomplete="email" required aria-describedby="dcs-email-err"><p class="dcs-err" id="dcs-email-err" hidden></p></div>
            <div class="dcs-field"><label for="dcs-company">Company</label><input type="text" id="dcs-company" name="company" autocomplete="organization" required aria-describedby="dcs-company-err"><p class="dcs-err" id="dcs-company-err" hidden></p></div>
            <div class="dcs-field dcs-field-wide"><label for="dcs-need">What do you need?</label><textarea id="dcs-need" name="need" rows="4" required aria-describedby="dcs-need-err"></textarea><p class="dcs-err" id="dcs-need-err" hidden></p></div>
          </div>
          <button type="submit" class="dcs-btn dcs-btn-primary">Talk to an Expert</button>
          <p class="dcs-consent" id="dcs-form-consent">We use these details only to reply to your request. See our <a href="/privacy-policy.html">Privacy Policy</a>.</p>
          <p class="dcs-form-status" role="alert" hidden></p>
        </form>
        <div class="dcs-success" tabindex="-1" hidden>
          <h3>Thank you. Your request has been received.</h3>
          <p>We will reply within one business day.</p>
        </div>
      </div>
    </div>
  </section>
